name: ARM64 ISO

# Builds the aarch64 ISO natively on linux-omarchy-n1x, the one kernel for
# every aarch64 board, boots it live under KVM, installs it unattended and
# boots what it installed.
# One runner does all of it, as the x86_64 install test does: the Apple-backed
# ones run Linux on Apple Silicon, and are the ARM runners with KVM.
#
# The push trigger exists while this lives on a branch: a manual run needs the
# workflow on the default branch first.
on:
  pull_request:
  push:
    branches: [arm64-generic]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arm64-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aarch64:
    name: "aarch64: build the ISO, boot it live, install it unattended, boot the result"
    # These runners are ours: a pull request from a fork does not get them.
    if: ${{ !github.event.pull_request.head.repo.fork }}
    runs-on: namespace-profile-arm64-linux-apple-12x32
    timeout-minutes: 120
    env:
      KERNEL: linux-omarchy-n1x
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          submodules: recursive
          persist-credentials: false

      - name: Runner
        run: |
          uname -srm
          echo "$(nproc) CPUs, $(free -h | awk 'NR==2 {print $2}') memory, $(df -h --output=avail . | tail -1 | tr -d ' ') free disk"
          grep -m2 -E 'CPU implementer|CPU part' /proc/cpuinfo || true
          docker version --format 'docker {{.Server.Version}}' || sudo docker version --format 'docker {{.Server.Version}}'
          ls -l /dev/kvm
          [[ -r /dev/kvm && -w /dev/kvm ]] || sudo chmod 666 /dev/kvm

      # The packages the offline mirror is built from: 3.3 GB that otherwise
      # come down again on every run. The build prunes what it no longer needs.
      # Skipped, not failed, on a runner profile without a cache volume.
      - name: Package cache (Namespace)
        continue-on-error: true
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          path: ~/.cache/omarchy

      # The Omarchy packages are built from source, as the N1x image builds
      # them: the published ones carry no aarch64 pacman configuration and none
      # of the platform support the build asks for, and until omarchy#14637
      # reaches edge their installer looks for an x64 Node tarball on every
      # architecture. omarchy's n1x branch has all of it.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          repository: omacom/omarchy
          ref: n1x
          path: src/omarchy
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          repository: omacom/omarchy-pkgs
          ref: n1x
          path: src/omarchy-pkgs
          persist-credentials: false

      # No channel serves linux-omarchy-n1x yet. omarchy-pkgs' CI has built it,
      # with the packages that go with it, so the build takes those builds.
      - name: Packages of the n1x branch that are not published yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./test/arm64-n1x-bundle src/omarchy-pkgs "$RUNNER_TEMP/bundle"

      - name: Build the ISO
        run: |
          start=$(date +%s)
          ./bin/omarchy-iso-make --arch aarch64 --no-boot-offer --kernel "$KERNEL" --package-dir "$RUNNER_TEMP/bundle" \
            --local-source src/omarchy src/omarchy-pkgs
          echo "Built in $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir -p evidence && echo "build_seconds=$(( $(date +%s) - start ))" >evidence/build-timing

      - name: Inspect the ISO
        run: |
          set -euo pipefail
          command -v bsdtar >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq libarchive-tools >/dev/null; }
          iso=$(ls release/*.iso)
          (cd release && sha256sum "$(basename "$iso")" | tee "$(basename "$iso").sha256")
          bsdtar -tvf "$iso" >listing.txt
          # What the firmware starts, what GRUB loads and what the installer installs from.
          for want in EFI/BOOT/BOOTAA64.EFI "arch/boot/aarch64/vmlinuz-$KERNEL" \
            "arch/boot/aarch64/initramfs-$KERNEL.img" arch/aarch64/airootfs.sfs; do
            grep -Eiq " $want\$" listing.txt || { echo "::error::$iso has no $want"; exit 1; }
          done
          {
            echo "\`$(basename "$iso")\`, $(( $(stat -c %s "$iso") / 1048576 )) MiB"
            echo
            echo '```'
            grep -E ' (arch/boot/aarch64|EFI/BOOT|arch/aarch64)/[^/]+$' listing.txt | awk '{print $5, $NF}'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The image through its own boot path: firmware, GRUB, the live kernel
      # and initramfs, the live root.
      - name: Boot the live ISO under KVM
        run: |
          ./test/arm64-container ./test/arm64-live-boot release/*.iso evidence/live
          echo "The live system was up after $(cut -d= -f2 evidence/live/timing) s." >>"$GITHUB_STEP_SUMMARY"

      # The whole path with nobody at the keyboard: the installer answers from
      # a cidata drive, writes the disk, and the machine restarts into what it
      # wrote.
      - name: Install unattended, reboot, check
        run: |
          ./test/arm64-container ./test/arm64-install release/*.iso evidence/install
          {
            echo "Installed, rebooted and checked in $(cut -d= -f2 evidence/install/timing) s."
            echo
            echo '```'
            cat evidence/install/checks
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      # The tests ran as root in their container, and QEMU writes its
      # screenshots readable by their owner only.
      - name: Record how it ended, and hand the evidence to the runner's user
        if: always()
        run: |
          mkdir -p evidence && sudo chown -R "$(id -u):$(id -g)" evidence
          echo "${{ job.status }}" >evidence/status

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: aarch64-${{ env.KERNEL }}-evidence-${{ github.run_number }}
          path: evidence
          retention-days: 7
          if-no-files-found: warn

  # One comment on the pull request with the timings, updated in place by later
  # runs, like the x86_64 install test's.
  comment:
    name: "aarch64: post the timings on the pull request"
    needs: aarch64
    if: ${{ always() && github.event_name == 'pull_request' && needs.aarch64.result != 'skipped' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: aarch64-*-evidence-${{ github.run_number }}
          path: evidence

      - name: Comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- omarchy-aarch64-install-test -->'
          dirs=(evidence/aarch64-*-evidence-*)
          kernel() { local k=${1#evidence/aarch64-}; echo "${k%-evidence-*}"; }
          seconds() { local v; v=$(cut -d= -f2 "$1" 2>/dev/null) && [ -n "$v" ] && echo "$v s" || echo "–"; }
          build() { seconds "$1/build-timing"; }
          live() { seconds "$1/live/timing"; }
          whole() { seconds "$1/install/timing"; }
          row() { # label, then a command that prints one cell for an evidence folder
            local label=$1 d; shift
            printf '| %s |' "$label"; for d in "${dirs[@]}"; do printf ' %s |' "$("$@" "$d")"; done; echo
          }
          result() { [ "$(cat "$1/status" 2>/dev/null)" = success ] && echo "✅ passed" || echo "❌ failed"; }
          install() { jq -r '"\((.finished_at - .started_at) * 10 | round / 10) s"' "$1/install/omarchy-install-timing.json" 2>/dev/null || echo "–"; }
          boot() { sed -n '1s/.*= *//p' "$1/install/systemd-analyze.txt" 2>/dev/null | grep . || echo "–"; }
          {
            echo "$marker"
            echo "### aarch64 install test"
            echo
            printf '| |'; for d in "${dirs[@]}"; do printf ' `%s` |' "$(kernel "$d")"; done; echo
            printf '| --- |'; for d in "${dirs[@]}"; do printf ' ---: |'; done; echo
            row "Result" result
            row "Build the ISO" build
            row "Live ISO to the installer" live
            row "Install" install
            row "Install, reboot and checks" whole
            row "First boot" boot
            for d in "${dirs[@]}"; do
              grep -q '^not ok' "$d/install/checks" 2>/dev/null || continue
              echo; echo "Failed on \`$(kernel "$d")\`:"; echo; grep '^not ok' "$d/install/checks" | sed 's/^not ok - /- /'
            done
            echo
            echo "[Run](${{ github.server_url }}/$REPO/actions/runs/${{ github.run_id }}) · ${HEAD_SHA:0:8}"
          } >comment.md
          cat comment.md
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            -q ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@comment.md >/dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -F body=@comment.md >/dev/null
          fi
